name = "ebay-price-worker"
main = "worker.js"
compatibility_date = "2024-11-01"

# D1 database. Create it with:  npx wrangler d1 create pricing-db
# then paste the database_id it prints here.
[[d1_databases]]
binding = "DB"
database_name = "pricing-db"
database_id = "YOUR_D1_DATABASE_ID"

# Secrets do NOT go here. Set them with:
#   npx wrangler secret put PRICING_KEY
#   npx wrangler secret put EBAY_CLIENT_ID
#   npx wrangler secret put EBAY_CLIENT_SECRET
